services:
  postgres:
    image: postgres:16-alpine
    container_name: lumayard-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: lumayard
      POSTGRES_PASSWORD: lumayard_dev
      POSTGRES_DB: lumayard
    ports:
      - "5432:5432"
    volumes:
      - lumayard-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lumayard -d lumayard"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  lumayard-postgres-data:
